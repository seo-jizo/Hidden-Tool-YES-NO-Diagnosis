<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>「非表示ツール」を使うべきか診断ツール | Google Search Console</title>
<style>
  :root {
    --bg: #faf9f5;
    --card: #ffffff;
    --text: #1f1e1b;
    --text-sec: #57564f;
    --text-ter: #8a897f;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --info: #185fa5;
    --yes-bg: #e1f5ee; --yes-text: #085041; --yes-strong: #0f6e56;
    --no-bg: #fcebeb; --no-text: #791f1f; --no-strong: #a32d2d;
    --maybe-bg: #faeeda; --maybe-text: #633806; --maybe-strong: #854f0b;
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1915;
      --card: #26251f;
      --text: #ededea;
      --text-sec: #b3b2a8;
      --text-ter: #84837a;
      --border: rgba(255,255,255,0.14);
      --border-strong: rgba(255,255,255,0.26);
      --info: #6aa9e8;
      --yes-bg: #0c3329; --yes-text: #9fe1cb; --yes-strong: #5dcaa5;
      --no-bg: #3a1414; --no-text: #f7c1c1; --no-strong: #f09595;
      --maybe-bg: #3a2710; --maybe-text: #fac775; --maybe-strong: #ef9f27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
  header { margin-bottom: 1.5rem; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--text-ter); margin: 0 0 6px; text-transform: uppercase; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; line-height: 1.4; }
  .sub { font-size: 14px; color: var(--text-sec); margin: 0; }
  .opentool {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 1rem;
    font-size: 14px; font-weight: 600;
    color: var(--info); text-decoration: none;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 9px 16px;
    transition: background 0.12s;
  }
  .opentool:hover { background: rgba(0,0,0,0.04); }
  @media (prefers-color-scheme: dark) { .opentool:hover { background: rgba(255,255,255,0.06); } }
  .opentool .ic { width: 15px; height: 15px; }
  .quiz {
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 1.25rem;
    background: var(--card);
  }
  .step { font-size: 13px; color: var(--text-ter); margin: 0 0 8px; }
  .q { font-size: 16px; font-weight: 600; line-height: 1.7; margin: 0 0 1.25rem; white-space: pre-line; }
  .btnrow { display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: transparent;
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 9px 18px;
    cursor: pointer;
    transition: background 0.12s, transform 0.05s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { background: rgba(0,0,0,0.04); }
  @media (prefers-color-scheme: dark) { button:hover { background: rgba(255,255,255,0.06); } }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  .yesno { min-width: 120px; justify-content: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 600;
    padding: 4px 12px; border-radius: var(--radius-sm); margin-bottom: 12px;
  }
  .rtitle { font-size: 18px; font-weight: 600; margin: 0 0 8px; line-height: 1.6; }
  .rbody { font-size: 15px; color: var(--text-sec); line-height: 1.8; margin: 0 0 1.25rem; white-space: pre-line; }
  a.toollink { font-size: 14px; color: var(--info); display: inline-block; margin-bottom: 1.25rem; }
  .back { margin-top: 1.25rem; font-size: 13px; padding: 7px 14px; }
  svg.ic { width: 16px; height: 16px; flex: none; }
  footer { margin-top: 1.75rem; font-size: 12px; color: var(--text-ter); line-height: 1.7; }
  .foot-lead { margin: 0 0 8px; }
  .foot-links { margin: 0; padding-left: 1.1em; }
  .foot-links li { margin-bottom: 3px; }
  footer a { color: var(--info); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Google Search Console</p>
    <h1>「非表示ツール」を使うべきか診断ツール</h1>
    <p class="sub">Google Search Console の非表示ツールを使うべきケースかどうかを、はい／いいえに答えるだけで判定します。</p>
    <a class="opentool" href="https://search.google.com/search-console/removals" target="_blank" rel="noopener">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
      Search Console の非表示ツールを開く
    </a>
  </header>
  <div class="quiz" id="quiz"></div>
  <footer>
    <p class="foot-lead">判定ロジックは以下のGoogle公式情報に基づきますが、Google公式ツールではありません。最終的な判断はご自身で原文をご確認ください。</p>
    <ul class="foot-links">
      <li><a href="https://support.google.com/webmasters/answer/9689846?hl=ja" target="_blank" rel="noopener">Search Console ヘルプ「非表示ツールとセーフサーチ レポートツール」</a></li>
      <li><a href="https://support.google.com/webmasters/community-guide/290624932/" target="_blank" rel="noopener">非表示ツールの正しい使い方 Googleコミュニティガイド</a></li>
    </ul>
  </footer>
</div>

<script>
const IC = {
  check: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  x: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  yes: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>',
  no: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  clock: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  refresh: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2 5.3M20 5v6h-6"/></svg>',
  back: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'
};

const nodes = {
  q1: { q: "非表示にしたいURLは、あなたがSearch Consoleで所有（確認済み）しているプロパティのものですか？", yes: "q2", no: "q1b" },
  q1b: { q: "そのページから、消したいコンテンツはすでに削除・更新されていますか？", yes: "r_outdated", no: "r_legal" },
  q2: { q: "消したい範囲は「Google検索の結果」だけですか？（他の検索エンジンやインターネット全体ではない）", yes: "q3", no: "r_scope" },
  q3: { q: "目的は次のいずれかに当てはまりますか？\n・重複URLの整理（正しいバージョンだけ残したい）\n・サイト移転・URL変更\n・手動対策やドメイン購入後の「ゼロから再スタート」\n・Search Consoleのクロールエラー対応\n・すでに404になった古いページの掃除（急ぎではない）", yes: "r_wrongtool", no: "q4" },
  q4: { q: "ページ自体は検索結果に残してよく、機密情報などを含む「古い説明文（スニペット）」だけを早く消したいですか？（ページは更新済み）", yes: "r_snippet", no: "q5" },
  q5: { q: "そのURLを「速やかに」（自然なクロールを待たずに）検索結果から消す必要がありますか？", yes: "q6", no: "r_wait" },
  q6: { q: "6か月を超えて、完全に検索結果から消したいですか？", yes: "r_permanent", no: "r_temp" },

  r_outdated: { verdict: "no", title: "このツールは使えません → 「古いコンテンツの更新ツール」へ", body: "所有していないサイトで、コンテンツがすでに削除済みの場合は、誰でも使える「古いコンテンツの更新ツール」で検索結果の更新をリクエストします。", link: "https://search.google.com/search-console/remove-outdated-content", linkLabel: "該当ツールを開く" },
  r_legal: { verdict: "no", title: "このツールは使えません → ウェブサイトの所有者に削除依頼してください", body: "但しポリシー違反や法的な問題がある場合などは、専用のフォームから削除リクエストできます。", link: "https://support.google.com/websearch/troubleshooter/3111061", linkLabel: "該当ページを開く" },
  r_scope: { verdict: "no", title: "このツールでは目的を達成できません", body: "非表示ツールが効くのはGoogle検索の結果のみです。他の検索エンジンやWeb全体から消すには、サーバー上でコンテンツ自体を削除するか、パスワード保護などでアクセスを遮断する必要があります。" },
  r_wrongtool: { verdict: "no", title: "使うべきでないケースです → 正しい方法へ", body: "・重複URLの整理 → canonical等の正規化（ツールを使うと全バージョンが消える恐れ）\n・サイト移転 → 「URL変更を伴うサイト移転」の手順\n・ゼロから再スタート → 再審査リクエスト\n・クロールエラー / 404済みの古いページ → 何もしなくても次回クロール時に自然に消えます" },
  r_snippet: { verdict: "yes", title: "使うべきケースです → 「検索結果のスニペットを消去する」", body: "ページ更新後の変更を検索結果に早く反映させたい場合に該当します。非表示ツールで「検索結果のスニペットを消去する」を選択。URLは拡張子・パラメータ含め完全一致が必要です。" },
  r_wait: { verdict: "maybe", title: "ツールは不要です", body: "緊急性がなければ、404/410を返すかnoindexを設定して、次回クロールでの自然な反映を待てば十分です。手動リクエストの必要はありません。" },
  r_temp: { verdict: "yes", title: "使うべきケースです → 「URLを一時的に非表示にする」", body: "約6か月間、Google検索結果からブロックされます（クロール自体は止まりません）。同じページを指す別URL（大文字小文字違い・パラメータ付き等）があれば、それぞれリクエストが必要です。" },
  r_permanent: { verdict: "yes", title: "使うべきケースです（ただし第一歩として）", body: "非表示ツール単体では約6か月で再表示されます。ツールでブロックしたうえで、恒久対応を必ず併用してください。\n・404/410を返す、またはパスワード保護\n・noindexメタタグ（robots.txtでのブロックはNG）\n恒久対応より先にブロックした場合は、一度解除して再ブロックするとインデックスから消去されます。" }
};

const meta = {
  yes:   { cls: "yes",   icon: IC.yes,   label: "使うべき" },
  no:    { cls: "no",    icon: IC.no,    label: "使うべきでない" },
  maybe: { cls: "maybe", icon: IC.clock, label: "不要（待てばOK）" }
};

let current = "q1";
let history = [];
const box = document.getElementById("quiz");

function el(tag, css, html) {
  const e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (html != null) e.innerHTML = html;
  return e;
}

function render() {
  const n = nodes[current];
  box.innerHTML = "";
  if (n.q) {
    box.appendChild(el("p", "font-size:13px;color:var(--text-ter);margin:0 0 8px;", "質問 " + (history.length + 1)));
    const q = el("p", null, null);
    q.className = "q";
    q.textContent = n.q;
    box.appendChild(q);
    const row = el("div", "display:flex;gap:12px;flex-wrap:wrap;");
    const mk = (label, next, icon) => {
      const b = el("button", null, icon + label);
      b.className = "yesno";
      b.onclick = () => { history.push(current); current = next; render(); };
      return b;
    };
    row.appendChild(mk("はい", n.yes, IC.check));
    row.appendChild(mk("いいえ", n.no, IC.x));
    box.appendChild(row);
  } else {
    const m = meta[n.verdict];
    const badge = el("div", "background:var(--" + m.cls + "-bg);color:var(--" + m.cls + "-text);", m.icon + "判定: " + m.label);
    badge.className = "badge";
    box.appendChild(badge);
    const t = el("p", null, null); t.className = "rtitle"; t.textContent = n.title; box.appendChild(t);
    const b = el("p", null, null); b.className = "rbody"; b.textContent = n.body; box.appendChild(b);
    if (n.link) {
      const a = el("a", null, n.linkLabel || "該当ツールを開く");
      a.className = "toollink"; a.href = n.link; a.target = "_blank"; a.rel = "noopener";
      box.appendChild(a);
    }
    const row = el("div", "display:flex;gap:12px;");
    const re = el("button", null, IC.refresh + "最初からやり直す");
    re.onclick = () => { history = []; current = "q1"; render(); };
    row.appendChild(re);
    box.appendChild(row);
  }
  if (history.length > 0 && nodes[current].q) {
    const back = el("button", null, IC.back + "戻る");
    back.className = "back";
    back.onclick = () => { current = history.pop(); render(); };
    box.appendChild(back);
  }
}
render();
</script>
</body>
</html>
